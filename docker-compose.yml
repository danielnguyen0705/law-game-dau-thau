version: "3.9"

services:
  ai-grading-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawgame-ai-grading
    ports:
      - "4002:4002"
    volumes:
      - ./data:/app/data:ro
    environment:
      - SERVICE_DIR=ai-grading-service
      - PORT=4002
    restart: unless-stopped

  game-engine-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawgame-game-engine
    ports:
      - "4001:4001"
    volumes:
      - ./data:/app/data:rw
    environment:
      - SERVICE_DIR=game-engine-service
      - PORT=4001
      - AI_GRADING_URL=http://ai-grading-service:4002
    depends_on:
      - ai-grading-service
    restart: unless-stopped

  frontend-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawgame-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - SERVICE_DIR=frontend-service
      - PORT=3000
      - GAME_ENGINE_URL=http://game-engine-service:4001
      - AI_GRADING_URL=http://ai-grading-service:4002
    depends_on:
      - game-engine-service
      - ai-grading-service
    restart: unless-stopped
